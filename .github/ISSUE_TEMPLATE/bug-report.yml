name: Bug report
description: Something is wrong with a skill, an example, or the install process
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Which skill or file?
      placeholder: vyson-css-motion
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Which AI agent and model?
      placeholder: Cursor, model name and version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact prompt you gave the agent and how you installed the skills.
    validations:
      required: true
